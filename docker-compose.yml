services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: ${APP_NAME:-estoque-api}-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MARIADB_DATABASE: ${DB_NAME:-estoque}
      MARIADB_USER: ${DB_USER:-estoque}
      MARIADB_PASSWORD: ${DB_PASSWORD:-estoque123}
    ports:
      - ${DB_EXTERNAL_PORT:-4406}:${DB_INTERNAL_PORT:-3306}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h localhost -u root -p${DB_ROOT_PASSWORD:-root123} --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build: .
    container_name: ${APP_NAME:-estoque-api}-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ['npx', 'prisma', 'migrate', 'deploy']

  seed:
    build: .
    container_name: ${APP_NAME:-estoque-api}-seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
    command:
      - /bin/sh
      - -c
      - |
        npx tsx prisma/seed.ts || {
          echo "Aviso: Seed falhou. Continuando..."
          exit 0
        }
    restart: 'no'

  app:
    build: .
    container_name: ${APP_NAME:-estoque-api}-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - ${APP_PORT:-5000}:${APP_PORT:-5000}

volumes:
  mariadb_data:
    name: ${DB_VOLUME:-mariadb_data}
