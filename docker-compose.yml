services:
  db:
    image: mariadb:11
    container_name: estoque-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: estoque
      MARIADB_USER: estoque
      MARIADB_PASSWORD: estoque123
    ports:
      - "3306:3306"
    volumes:
      - estoque-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot123",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build: .
    container_name: estoque-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://estoque:estoque123@db:3306/estoque
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build: .
    container_name: estoque-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: mysql://estoque:estoque123@db:3306/estoque
    ports:
      - "5001:5001"

volumes:
  estoque-data:
